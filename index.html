<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华糖 TMS 演示页</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #1a1a1a;
      --border: #303030;
      --text: #e8e8e8;
      --muted: #8c8c8c;
      --link: #69b1ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 48px 24px;
      line-height: 1.6;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .card a {
      color: var(--link);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
    }
    .card a:hover { text-decoration: underline; }
    .card .desc { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>华糖 TMS 静态演示</h1>
    <p>GitHub Pages 托管入口。可直接打开下列页面（任意设备浏览器访问）。</p>

    <div class="card">
      <a href="./huatang-fault-type-maintenance.html">故障类型维护</a>
      <div class="desc">设备故障类型维护页（仿不良类别 CRUD 布局）</div>
    </div>

    <div class="card">
      <a href="./huatang-digital-status.html">华糖数字化现状</a>
      <div class="desc">数字化现状深度拆解爆炸图</div>
    </div>

    <div class="card">
      <a href="./README.md">查看完整页面清单</a>
      <div class="desc">仓库内其余方案页说明见 README</div>
    </div>
  </div>
</body>
</html>
